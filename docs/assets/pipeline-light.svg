<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How Thermool works: your oligo goes to Strider in Rust; on request each analysis also goes to IDT OligoAnalyzer; both appear side by side">
<style>
  .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
  .flow.slow { animation-duration: 1.8s; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .glow { animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: 0.35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } }
</style>
<rect x="1" y="1" width="1278" height="298" rx="20" fill="#fbfbfc" stroke="#e4e4e8" stroke-width="1.5"/>
<rect x="40" y="40" width="300" height="124" rx="14" fill="#ffffff" stroke="#9a9aa3" stroke-width="1.6"/>
<rect x="40" y="40" width="6" height="124" rx="3" fill="#9a9aa3"/>
<text x="64" y="74" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#18181b">Your oligo</text>
<rect x="270.0" y="57" width="56" height="22" rx="11" fill="#f3f3f5"/>
<text x="298" y="72" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9a9aa3">paste</text>
<text x="64" y="100" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">5′ to 3′, raw or FASTA</text>
<text x="64" y="121" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">optional partner strand</text>
<text x="64" y="142" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">Na⁺ · Mg²⁺ · dNTPs · oligo</text>
<rect x="470" y="40" width="340" height="124" rx="14" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.6"/>
<rect x="470" y="40" width="6" height="124" rx="3" fill="#1f4fd1"/>
<text x="494" y="74" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#18181b">Strider engine</text>
<rect x="747.6" y="57" width="48" height="22" rx="11" fill="#dfe6fb"/>
<text x="772" y="72" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#1f4fd1">Rust</text>
<text x="494" y="100" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">Tm, GC, duplex ΔG / ΔH / ΔS</text>
<text x="494" y="121" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">5 ranked hairpins and dimers</text>
<text x="494" y="142" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">Mathews 2004 or SantaLucia 2004</text>
<rect x="940" y="40" width="300" height="124" rx="14" fill="#ffffff" stroke="#18181b" stroke-width="1.6"/>
<rect x="940" y="40" width="6" height="124" rx="3" fill="#18181b"/>
<text x="964" y="74" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#18181b">Side by side</text>
<rect x="1192.8" y="57" width="33" height="22" rx="11" fill="#f3f3f5"/>
<text x="1209" y="72" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#18181b">UI</text>
<text x="964" y="100" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">Strider next to IDT</text>
<text x="964" y="121" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">matched structure by structure</text>
<text x="964" y="142" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">light and dark, any screen</text>
<rect x="470" y="196" width="340" height="82" rx="14" fill="#ffffff" stroke="#0f7a6c" stroke-width="1.6"/>
