<text x="757" y="228" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0f7a6c">optional</text>
<text x="494" y="256" font-family="'IBM Plex Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c5c66">your account, on demand, via proxy</text>
