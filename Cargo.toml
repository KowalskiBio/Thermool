[package]
name = "thermool"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Vojtech Rejtar <rejtarv@gmail.com>"]
description = "Single-oligo thermodynamics: Strider Tm, hairpins and dimers, with optional IDT OligoAnalyzer comparison."

[[bin]]
name = "thermool"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
# Strider, as packaged by Primerool (sibling checkout).
engine = { path = "../Primerool/crates/engine" }
thermo-core = { path = "../Primerool/crates/thermo-core" }
