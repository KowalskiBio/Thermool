[workspace]
members = ["crates/thermo-core"]
resolver = "2"

[package]
name = "thermool"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Vojtech Rejtar <rejtarv@gmail.com>"]
description = "Single-oligo thermodynamics: Strider Tm, hairpins and dimers, with optional IDT OligoAnalyzer comparison."

[[bin]]
name = "thermool"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
# Strider, vendored into this repo (crates/thermo-core).
thermo-core = { path = "crates/thermo-core" }
